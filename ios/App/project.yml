name: DSHNative
options:
  bundleIdPrefix: com.dshnative
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DSHEngine:
    path: ../DSHEngine

targets:
  DSHNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: DSHEngine
        product: DSHEngine
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DSH
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshnative.mini
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO

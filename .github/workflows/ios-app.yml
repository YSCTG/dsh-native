name: ios-app

# 在 GitHub 的 macOS runner 上构建 iOS App（XcodeGen 生成工程），
# 装进模拟器、启动、截图，把截图作为 artifact 传回来。
#
# 这条工作流解决的是之前"界面从没编译过"的问题：SwiftUI 的错误在
# xcodebuild 里会直接以红字给出，截图能证明界面真的画出来了。

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/App/**'
      - 'ios/DSHEngine/**'
      - '.github/workflows/ios-app.yml'

jobs:
  build-and-screenshot:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tail -20
          ls -la

      - name: 选一台模拟器
        id: pick
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$DEV" ]; then
            DEV=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          fi
          echo "device=$DEV" >> "$GITHUB_OUTPUT"
          echo "选中模拟器：$DEV"

      - name: 构建（模拟器）
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project DSHNative.xcodeproj \
            -scheme DSHNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.pick.outputs.device }}" \
            -derivedDataPath build \
            build 2>&1 | tail -60

      - name: 装进模拟器并启动
        id: run
        run: |
          set -o pipefail
          DEV="${{ steps.pick.outputs.device }}"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          APP=$(find ios/App/build -name "DSHNative.app" -maxdepth 6 | head -1)
          echo "app=$APP"
          xcrun simctl install "$DEV" "$APP"

          # 1) 先正常启动，截主界面
          xcrun simctl launch "$DEV" com.dshnative.mini || true
          sleep 8
          xcrun simctl io "$DEV" screenshot /tmp/app.png
          ls -l /tmp/app.png

          # 2) 再以 -selfcheck 启动，截自检结果（工具在 iOS 沙盒里跑一遍）
          xcrun simctl terminate "$DEV" com.dshnative.mini || true
          sleep 1
          xcrun simctl launch "$DEV" com.dshnative.mini -selfcheck || true
          sleep 10
          xcrun simctl io "$DEV" screenshot /tmp/selfcheck.png
          ls -l /tmp/selfcheck.png

          # 3) 交互演示：App 自己驱动三个页签（请求/WebView/JS）
          xcrun simctl terminate "$DEV" com.dshnative.mini || true
          sleep 1
          xcrun simctl launch "$DEV" com.dshnative.mini -uidemo || true
          sleep 25
          xcrun simctl io "$DEV" screenshot /tmp/uidemo.png
          ls -l /tmp/uidemo.png

          # 4) 真实对话（需要仓库 Secret DEEPSEEK_KEY；没有就跳过）
          if [ -n "${{ secrets.DEEPSEEK_KEY }}" ]; then
            xcrun simctl terminate "$DEV" com.dshnative.mini || true
            sleep 1
            SIMCTL_CHILD_DEEPSEEK_KEY="${{ secrets.DEEPSEEK_KEY }}" \
              xcrun simctl launch "$DEV" com.dshnative.mini -live || true
            sleep 30
            xcrun simctl io "$DEV" screenshot /tmp/live.png
            ls -l /tmp/live.png
          else
            echo "没有配置 DEEPSEEK_KEY，跳过真实对话"
          fi

          # 5) 工具调用端到端：让模型调 fs_write 写文件
          if [ -n "${{ secrets.DEEPSEEK_KEY }}" ]; then
            xcrun simctl terminate "$DEV" com.dshnative.mini || true
            sleep 1
            SIMCTL_CHILD_DEEPSEEK_KEY="${{ secrets.DEEPSEEK_KEY }}" \
              xcrun simctl launch "$DEV" com.dshnative.mini -tools || true
            sleep 60
            xcrun simctl io "$DEV" screenshot /tmp/tools.png
            ls -l /tmp/tools.png

            # 用 shell 直接看 App 容器里的文件 —— 不依赖模型的说法
            CONTAINER=$(xcrun simctl get_app_container "$DEV" com.dshnative.mini data)
            echo "container=$CONTAINER"
            ls -la "$CONTAINER/Documents/workspace/" 2>/dev/null || true
            echo "--- tool-demo.txt ---"
            cat "$CONTAINER/Documents/workspace/tool-demo.txt" 2>/dev/null || echo "(文件不存在)"

            xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "DSHNative"' 2>/dev/null | grep -F "[tools]" | tail -12 || true
          else
            echo "没有 DEEPSEEK_KEY，跳过工具调用演示"
          fi

          # 6) 设置页截图
          xcrun simctl terminate "$DEV" com.dshnative.mini || true
          sleep 1
          xcrun simctl launch "$DEV" com.dshnative.mini -settings || true
          sleep 2
          xcrun simctl io "$DEV" screenshot /tmp/settings.png
          ls -l /tmp/settings.png

          # 7) 会话列表 + Markdown 渲染截图
          xcrun simctl terminate "$DEV" com.dshnative.mini || true
          sleep 1
          xcrun simctl launch "$DEV" com.dshnative.mini -sessions || true
          sleep 3
          xcrun simctl io "$DEV" screenshot /tmp/sessions.png
          ls -l /tmp/sessions.png

          xcrun simctl terminate "$DEV" com.dshnative.mini || true
          sleep 1
          xcrun simctl launch "$DEV" com.dshnative.mini -md || true
          sleep 3
          xcrun simctl io "$DEV" screenshot /tmp/md.png
          ls -l /tmp/md.png

          # 8) 文件浏览 + 任务面板
          xcrun simctl terminate "$DEV" com.dshnative.mini || true
          sleep 1
          xcrun simctl launch "$DEV" com.dshnative.mini -files || true
          sleep 3
          xcrun simctl io "$DEV" screenshot /tmp/files.png

          xcrun simctl terminate "$DEV" com.dshnative.mini || true
          sleep 1
          xcrun simctl launch "$DEV" com.dshnative.mini -tasks || true
          sleep 3
          xcrun simctl io "$DEV" screenshot /tmp/tasks.png
          ls -l /tmp/files.png /tmp/tasks.png

          # 把控制台里的结论也捞出来
          xcrun simctl spawn "$DEV" log show --last 3m --predicate 'process == "DSHNative"' 2>/dev/null | grep -F "[selfcheck]" | tail -5 || true
          echo "device=$DEV" >> "$GITHUB_OUTPUT"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: |
            /tmp/app.png
            /tmp/selfcheck.png
            /tmp/uidemo.png
            /tmp/live.png
            /tmp/tools.png
            /tmp/settings.png
            /tmp/sessions.png
            /tmp/md.png
            /tmp/files.png
            /tmp/tasks.png
          if-no-files-found: warn

      - name: 构建真机版并打包未签名 ipa
        if: always()
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project DSHNative.xcodeproj \
            -scheme DSHNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -30 || {
              echo "真机版构建失败（模拟器版已通过，先不阻塞）"
              exit 0
            }
          APP=$(find build-device -name "DSHNative.app" -maxdepth 6 | head -1)
          echo "device app: $APP"
          if [ -n "$APP" ]; then
            rm -rf /tmp/payload && mkdir -p /tmp/payload/Payload
            cp -R "$APP" /tmp/payload/Payload/
            (cd /tmp/payload && zip -qry /tmp/DSHNative-unsigned.ipa Payload)
            ls -lh /tmp/DSHNative-unsigned.ipa
          fi

      - name: 上传未签名 ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: /tmp/DSHNative-unsigned.ipa
          if-no-files-found: warn

      - name: 失败时抓日志
        if: failure()
        run: |
          DEV="${{ steps.pick.outputs.device }}"
          xcrun simctl spawn "$DEV" log show --last 3m --predicate 'process == "DSHNative"' 2>/dev/null | tail -40 || true

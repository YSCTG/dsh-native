name: ios-env-probe

# 只为验证：从 Windows 提交、在 GitHub 的 macOS runner 上能不能拿到
# Xcode 工具链与 iOS 模拟器。不构建任何产品代码。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-env.yml'

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Swift 版本
        run: swift --version

      - name: 可用模拟器（前 20 行）
        run: xcrun simctl list devices available | head -20

      - name: 实际启动一台模拟器并截图
        run: |
          set -e
          DEV=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device=$DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          xcrun simctl io "$DEV" screenshot /tmp/sim.png
          ls -l /tmp/sim.png

      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: /tmp/sim.png
